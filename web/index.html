<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiuEr 情报看板</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
  --text:#e6e8ec; --muted:#9aa3b2; --accent:#3fb98c; --warn:#e0a34a; --danger:#e0605e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:20px}
h1{font-size:18px;font-weight:500;margin-bottom:4px}
.sub{color:var(--muted);font-size:12px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
.card .k{color:var(--muted);font-size:12px;margin-bottom:6px}
.card .v{font-size:22px;font-weight:500}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h2{font-size:14px;font-weight:500;margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.bar .name{width:120px;color:var(--muted);flex-shrink:0}
.bar .track{flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar .cnt{width:44px;text-align:right;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:400}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--panel2);color:var(--muted)}
.tag{color:var(--accent)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.ok{background:var(--accent)} .bad{background:var(--danger)}
.chatbox{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;margin-bottom:12px}
.msg{padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.5;max-width:80%}
.msg.scammer{background:var(--panel2);align-self:flex-start}
.msg.agent{background:#1c3329;align-self:flex-end}
.msg .who{font-size:10px;color:var(--muted);margin-bottom:3px}
.row{display:flex;gap:8px;margin-top:8px}
input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-size:13px}
button{background:var(--accent);border:none;border-radius:6px;padding:8px 16px;color:#0f1115;font-size:13px;cursor:pointer;font-weight:500}
button:hover{opacity:.9}
select{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:13px}
.scroll{max-height:340px;overflow-y:auto}
code{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--accent)}
</style>
</head>
<body>
<h1>LiuEr 情报看板</h1>
<div class="sub">本地部署 · 全离线推理 · 仅用于经授权的防御场景</div>

<div class="grid" id="stats">
  <div class="card"><div class="k">情报总数</div><div class="v">-</div></div>
  <div class="card"><div class="k">会话总数</div><div class="v">-</div></div>
  <div class="card"><div class="k">已结束会话</div><div class="v">-</div></div>
  <div class="card"><div class="k">处理轮次</div><div class="v">-</div></div>
  <div class="card"><div class="k">LLM 状态</div><div class="v" style="font-size:14px">-</div></div>
</div>

<div class="panel">
  <h2>实时对话测试</h2>
  <div class="chatbox" id="chat"></div>
  <div class="row">
    <select id="intent">
      <option value="none">无任务（纯拖延）</option>
      <option value="harvest_bank_account">套取银行账号</option>
      <option value="harvest_crypto_wallet">套取加密钱包</option>
      <option value="harvest_domains">套取钓鱼链接</option>
      <option value="harvest_phone_numbers">套取联系电话</option>
      <option value="map_network">摸清团伙结构</option>
    </select>
    <input id="text" placeholder="输入诈骗方说的话，例如：您好，这里是公安局，您的账户涉嫌洗钱">
    <button onclick="send()">发送</button>
  </div>
  <div class="row" style="font-size:11px;color:var(--muted)">
    会话 ID：<code id="sid">-</code>　人格：<code id="persona">-</code>　阶段：<code id="stage">-</code>
  </div>
</div>

<div class="cols">
  <div class="panel">
    <h2>情报分类</h2>
    <div id="byKind"></div>
  </div>
  <div class="panel">
    <h2>被冒用品牌</h2>
    <div id="byBrand"></div>
  </div>
</div>

<div class="cols">
  <div class="panel">
    <h2>诈骗话术类型</h2>
    <div id="byTactic"></div>
  </div>
  <div class="panel">
    <h2>情绪操纵轴</h2>
    <div id="byAxis"></div>
  </div>
</div>

<div class="panel">
  <h2>情报列表</h2>
  <div class="scroll">
    <table>
      <thead><tr><th>类型</th><th>值</th><th>置信度</th><th>来源</th><th>时间</th></tr></thead>
      <tbody id="intelBody"></tbody>
    </table>
  </div>
</div>

<script>
let sid=null;

async function send(){
  const t=document.getElementById('text').value.trim();
  if(!t)return;
  add('chat','scammer',t);
  document.getElementById('text').value='';
  const mission={intent:document.getElementById('intent').value};
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({peer:'tester',text:t,session_id:sid,channel:'web',mission})});
    const d=await r.json();
    sid=d.session_id;
    document.getElementById('sid').textContent=sid;
    if(d.persona){document.getElementById('persona').textContent=
      d.persona.name+' / '+d.persona.age+'岁 / '+d.persona.accent;}
    document.getElementById('stage').textContent=d.stage||'-';
    if(d.reply)add('chat','agent',d.reply);
    refresh();
  }catch(e){add('chat','agent','[错误] '+e);}
}

function add(box,who,text){
  const el=document.createElement('div');
  el.className='msg '+who;
  el.innerHTML='<div class="who">'+(who==='scammer'?'诈骗方':'Agent')+'</div>'+text;
  document.getElementById(box).appendChild(el);
  document.getElementById(box).scrollTop=99999;
}

function bar(container,obj){
  const el=document.getElementById(container);
  const items=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(!items.length){el.innerHTML='<div style="color:var(--muted);font-size:12px">暂无数据</div>';return;}
  const max=items[0][1];
  el.innerHTML=items.map(([k,v])=>
    `<div class="bar"><div class="name">${k}</div>
     <div class="track"><div class="fill" style="width:${v/max*100}%"></div></div>
     <div class="cnt">${v}</div></div>`).join('');
}

async function refresh(){
  try{
    const h=await (await fetch('/api/health')).json();
    const m=h.metrics||{};
    const cards=document.querySelectorAll('#stats .card .v');
    const s=await (await fetch('/api/intel/stats')).json();
    cards[0].textContent=s.total||0;
    cards[1].textContent=Math.round(m.sessions_total||0);
    cards[2].textContent=Math.round(m.sessions_ended||0);
    cards[3].textContent=Math.round(m.turns_processed||0);
    cards[4].innerHTML='<span class="dot '+(h.llm.ok?'ok':'bad')+'"></span>'+(h.llm.ok?'就绪':'未就绪');
    bar('byKind',s.by_kind); bar('byBrand',s.by_brand);
    bar('byTactic',s.by_tactic); bar('byAxis',s.by_axis);

    const r=await (await fetch('/api/intel?limit=60')).json();
    document.getElementById('intelBody').innerHTML=(r.records||[]).map(x=>
      `<tr><td><span class="badge">${x.kind}</span></td>
       <td><code>${x.value}</code></td>
       <td class="tag">${(x.confidence*100).toFixed(0)}%</td>
       <td>${x.source}</td><td>${new Date(x.created_at*1000).toLocaleTimeString()}</td></tr>`).join('');
  }catch(e){console.error(e);}
}
refresh(); setInterval(refresh,4000);
document.getElementById('text').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
